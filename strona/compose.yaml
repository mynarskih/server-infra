services:
  strona:
    image: nginx:alpine
    container_name: strona-web
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 64m
    cpus: "0.5"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../caddy/site:/usr/share/nginx/html:ro
      - ../branding/studio:/usr/share/nginx/html/design:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: caddy_default
