<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="/brand-studio.svg?v=12" type="image/svg+xml"><link rel="stylesheet" href="/styles.css?v=11"><link rel="stylesheet" href="/admin/admin.css?v=4"><script src="/design/app.js?v=6" defer></script><script src="/admin/admin.js?v=1" defer></script><title>Panel administratora — serwerbb.win</title><script src="/design/motion.js?v=1" defer></script></head><body><a class="skip-link" href="#main-content">Przejdź do treści</a>
<header class="wrap topbar"><a class="brand" href="/"><img src="/brand-studio.svg?v=12" alt=""><span>Panel administratora</span></a><a class="button" href="/">Wróć do strony</a></header>
<main id="main-content" tabindex="-1" class="wrap admin-main"><section class="admin-login" data-admin-login><p class="eyebrow">Dostęp chroniony</p><h1>Logowanie</h1><form data-login-form><label>Hasło administratora<input type="password" name="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Zaloguj</button><p class="form-notice" role="status" aria-live="polite" data-login-notice></p></form></section>
<section class="admin-dashboard" data-admin-dashboard hidden><div class="admin-heading"><div><p class="eyebrow">Centrum zarządzania</p><h1>Panel administratora</h1></div><button class="button" type="button" data-logout>Wyloguj</button></div><div class="admin-stats" data-admin-stats></div>
<div class="admin-grid"><section class="admin-panel"><h2>Statystyki odwiedzin</h2><p class="panel-note">Zagregowane dane z 30 dni — bez adresów IP i bez profili użytkowników.</p><div class="table-wrap"><table><thead><tr><th>Dzień</th><th>Strona</th><th>Urządzenie</th><th>Odsłony</th></tr></thead><tbody data-analytics-table></tbody></table></div></section><section class="admin-panel"><h2>Wiadomości</h2><div class="admin-list" data-messages-list></div></section></div>
<div class="admin-grid"><section class="admin-panel"><h2>Dodaj artykuł</h2><form data-content-form="posts"><label>Tytuł<input name="title" required minlength="3"></label><label>Krótki opis<textarea name="summary" required minlength="10"></textarea></label><label>Treść<textarea name="body" required minlength="20" rows="8"></textarea></label><button class="button primary" type="submit">Dodaj artykuł</button><p class="form-notice" role="status" aria-live="polite"></p></form><div class="admin-list" data-posts-list></div></section><section class="admin-panel"><h2>Dodaj projekt</h2><form data-content-form="projects"><label>Tytuł<input name="title" required minlength="3"></label><label>Krótki opis<textarea name="summary" required minlength="10"></textarea></label><label>Opis projektu<textarea name="body" required minlength="20" rows="6"></textarea></label><label>Kategoria<select name="category"><option value="web">Strona</option><option value="cloud">Chmura</option><option value="infra">Infrastruktura</option><option value="inne">Inne</option></select></label><label>Adres projektu<input name="url" type="url"></label><button class="button primary" type="submit">Dodaj projekt</button><p class="form-notice" role="status" aria-live="polite"></p></form><div class="admin-list" data-projects-list></div></section></div></section></main></body></html>
