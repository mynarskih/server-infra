<main id="main-content" tabindex="-1" class="wrap page-main"><p class="eyebrow">Kontakt</p><h1 class="page-title">Napisz wiadomość.</h1><p class="lead">Wiadomość zostanie bezpiecznie zapisana na serwerze i będzie widoczna wyłącznie w panelu administratora.</p><section class="section"><form class="contact-form" data-contact-form><div class="form-grid"><label>Imię<input name="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>Adres e-mail<input name="email" type="email" required maxlength="180" autocomplete="email"></label></div><label>Temat<input name="subject" required minlength="3" maxlength="140"></label><label>Wiadomość<textarea name="message" required minlength="10" maxlength="5000" rows="8"></textarea></label><div class="honeypot" inert><label>Firma<input name="company" tabindex="-1" autocomplete="off"></label></div><label class="checkbox"><input name="privacy" type="checkbox" required><span>Zgadzam się na zapisanie podanych danych w celu obsługi tej wiadomości.</span></label><button class="button primary" type="submit">Wyślij wiadomość</button><p class="form-notice" role="status" aria-live="polite" data-form-notice aria-live="polite"></p></form></section></main>
